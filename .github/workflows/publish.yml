name: Build and publish

on:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Validate release package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      version: ${{ steps.package.outputs.version }}
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          package-manager-cache: false

      - name: Validate package version and release reference
        id: package
        env:
          RELEASE_REF: ${{ github.ref }}
          EVENT_NAME: ${{ github.event_name }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync, readFileSync } from 'node:fs';

          const { name, version } = JSON.parse(readFileSync('package.json', 'utf8'));
          if (name !== '@nuberea/openclaw') {
            throw new Error(`Unexpected package: ${name}`);
          }
          if (!/^(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)$/.test(version)) {
            throw new Error('Releases must use a stable major.minor.patch version');
          }
          const ref = process.env.RELEASE_REF;
          if (process.env.EVENT_NAME !== 'pull_request' &&
              ref !== 'refs/heads/main' && ref !== `refs/tags/v${version}`) {
            throw new Error(`Release ref ${ref} does not match main or v${version}`);
          }
          appendFileSync(process.env.GITHUB_OUTPUT, `version=${version}\n`);
          NODE

      - name: Install locked dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: Build
        run: npm run build

      - name: Run tests when available
        run: npm test --if-present

      - name: Check shipped dependency audit
        run: npm audit --omit=dev

      - name: Pack release artifact
        run: npm pack

      - uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: nuberea-openclaw-*.tgz
          if-no-files-found: error
          retention-days: 7

  publish:
    name: Publish new version to npm
    needs: build
    if: >-
      github.repository == 'streamsapps/nuberea-openclaw' &&
      github.event_name != 'pull_request' &&
      (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@v6
        with:
          node-version: '26'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Check whether this version needs publishing
        id: registry
        env:
          PACKAGE_VERSION: ${{ needs.build.outputs.version }}
        run: |
          node --input-type=module <<'NODE'
          import { appendFileSync } from 'node:fs';

          const version = process.env.PACKAGE_VERSION;
          const response = await fetch('https://registry.npmjs.org/@nuberea%2Fopenclaw', {
            signal: AbortSignal.timeout(30_000),
          });
          if (!response.ok) {
            throw new Error(`Cannot check npm registry: HTTP ${response.status}`);
          }
          const metadata = await response.json();
          const published = Object.hasOwn(metadata.versions, version);
          if (!published) {
            const latest = metadata['dist-tags'].latest;
            const nextParts = version.split('.').map(Number);
            const latestParts = latest.split('.').map(Number);
            const difference = nextParts.findIndex((part, index) => part !== latestParts[index]);
            if (difference === -1 || nextParts[difference] < latestParts[difference]) {
              throw new Error(`Refusing to move latest backwards from ${latest} to ${version}`);
            }
          }
          console.log(published ? `${version} is already published; skipping` : `Publishing ${version}`);
          appendFileSync(process.env.GITHUB_OUTPUT, `publish=${!published}\n`);
          NODE

      - uses: actions/download-artifact@v5
        if: steps.registry.outputs.publish == 'true'
        with:
          name: npm-package

      - name: Publish validated artifact with trusted publishing
        if: steps.registry.outputs.publish == 'true'
        run: npm publish nuberea-openclaw-*.tgz --access public --provenance --tag latest

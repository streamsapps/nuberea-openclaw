name: Plugin CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: Build, test, and inspect package
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '26'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build and test registration
        run: npm test
      - name: Check shipped dependency audit
        run: npm audit --omit=dev
      - name: Inspect package
        run: npm pack --dry-run
